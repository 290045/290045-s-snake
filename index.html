<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>290045's Snake Game</title>
    <style>
        body { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #222; color: #fff; font-family: sans-serif; margin: 0; }
        canvas { background: #111; border: 4px solid #555; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        #score { font-size: 24px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div id="score">Score: 0</div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const scoreElement = document.getElementById("score");

const gridSize = 20;
const tileCount = canvas.width / gridSize;

let snake = [{ x: 10, y: 10 }];
let food = { x: 5, y: 5 };
let dx = 1; // horizontal velocity
let dy = 0; // vertical velocity
let score = 0;
let gameInterval;

function startGame() {
    gameInterval = setInterval(update, 100);
}

function update() {
    // 1. Move Snake Head
    const head = { x: snake[0].x + dx, y: snake[0].y + dy };
    
    // 2. Check Wall Collisions
    if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
        return gameOver();
    }

    // 3. Check Self Collision
    for (let cell of snake) {
        if (head.x === cell.x && head.y === cell.y) return gameOver();
    }

    // Add new head
    snake.unshift(head);

    // 4. Check Food Collision
    if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreElement.innerText = "Score: " + score;
        generateFood();
    } else {
        snake.pop(); // Remove tail if no food eaten
    }

    draw();
}

function draw() {
    // Clear Canvas
    ctx.fillStyle = "#111";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Draw Snake
    ctx.fillStyle = "#4CAF50";
    for (let cell of snake) {
        ctx.fillRect(cell.x * gridSize, cell.y * gridSize, gridSize - 2, gridSize - 2);
    }

    // Draw Food
    ctx.fillStyle = "#FF5722";
    ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);
}

function generateFood() {
    food.x = Math.floor(Math.random() * tileCount);
    food.y = Math.floor(Math.random() * tileCount);
}

function gameOver() {
    clearInterval(gameInterval);
    alert(`Game Over! Your Score: ${score}`);
    // Reset game state
    snake = [{ x: 10, y: 10 }];
    dx = 1; dy = 0; score = 0;
    scoreElement.innerText = "Score: 0";
    generateFood();
    startGame();
}

// 5. Handle Keyboard Controls
window.addEventListener("keydown", e => {
    switch (e.key) {
        case "ArrowUp":    if (dy !== 1)  { dx = 0; dy = -1; } break;
        case "ArrowDown":  if (dy !== -1) { dx = 0; dy = 1; }  break;
        case "ArrowLeft":  if (dx !== 1)  { dx = -1; dy = 0; } break;
        case "ArrowRight": if (dx !== -1) { dx = 1; dy = 0; }  break;
    }
});

// Start the game loop
generateFood();
startGame();
</script>
</body>
</html>
