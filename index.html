<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>290045's Snake Game</title>
    <style>
        body { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #0B0B1E; color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; user-select: none; overflow: hidden; }
        #game-container { position: relative; box-shadow: 0 0 30px rgba(122, 60, 255, 0.3); border-radius: 12px; overflow: hidden; border: 2px solid #3d3b75; }
        #top-bar { width: 560px; height: 50px; background: #141432; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; box-sizing: border-box; font-size: 24px; font-weight: bold; border-bottom: 2px solid #23234b; }
        .ui-element { display: flex; align-items: center; gap: 10px; }
        canvas { background: #050510; display: block; }
        #ui-overlay { position: absolute; top: 50px; left: 0; width: 560px; height: 560px; background: rgba(5, 5, 15, 0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(8px); }
        #ui-overlay.hidden { display: none; }
        #ui-overlay h1 { font-size: 40px; margin: 0 0 10px 0; color: #00E5FF; text-shadow: 0 0 15px rgba(0, 229, 255, 0.6); text-align: center; }
        #ui-overlay p { font-size: 20px; margin: 0 0 30px 0; color: #a0a0d0; }
        #play-btn { background: #7C4DFF; color: white; border: none; padding: 12px 35px; font-size: 22px; font-weight: bold; border-radius: 25px; cursor: pointer; box-shadow: 0 0 15px rgba(124, 77, 255, 0.4); transition: all 0.2s ease; }
        #play-btn:hover { background: #9E7CC1; box-shadow: 0 0 25px rgba(124, 77, 255, 0.8); transform: translateY(-2px); }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="top-bar">
            <div class="ui-element">🚀 <span id="score">0</span></div>
            <div class="ui-element">🏆 <span id="highscore">0</span></div>
        </div>
        <canvas id="gameCanvas" width="560" height="560"></canvas>
        <div id="ui-overlay">
            <h1 id="menu-title">290045's Snake Game</h1>
            <p id="menu-text">Press PLAY, Spacebar, or Enter</p>
            <button id="play-btn">PLAY</button>
        </div>
    </div>

    <!-- This links your html seamlessly to your logic file -->
    <script src="game.js"></script>
</body>
</html>
