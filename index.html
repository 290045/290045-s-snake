            background: #0B0B1E; /* Deep cosmic purple space background */
            color: #fff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            user-select: none;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 30px rgba(122, 60, 255, 0.3);
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #3d3b75;
        }
        #top-bar {
            width: 560px;
            height: 50px;
            background: #141432;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
            font-size: 24px;
            font-weight: bold;
            border-bottom: 2px solid #23234b;
        }
        .ui-element {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        canvas { 
            background: #050510;

        }

            position: absolute;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            transition: opacity 0.3s ease;

        draw(interpolationProgress);
    } else {
        draw(0);
    }

function updateLogic() {
    dx = nextDx;
    dy = nextDy;

    // The [0] tells JavaScript to look at the very front segment (the head)
    const head = { x: snake[0].x + dx, y: snake[0].y + dy };

        return gameOver();

    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
        score += 1; 
        scoreElement.innerText = score;
        if (score > highscore) {
            highscore = score;
            highscoreElement.innerText = highscore;
        }
        generateFood();
    } else {
        snake.pop();

function generateFood() {
    let validPosition = false;
    while (!validPosition) {
        food.x = Math.floor(Math.random() * tileCount);
        food.y = Math.floor(Math.random() * tileCount);
        
        validPosition = true;
        for (let cell of snake) {
            if (cell.x === food.x && cell.y === food.y) {
                validPosition = false;
                break;
            }
        }
    }
}

function gameOver() {
    isPlaying = false;
    menuTitle.innerText = "MISSION FAILED";
    menuTitle.style.color = "#FF1744";
    menuText.innerText = `Final Cargo Collected: ${score}`;
    playBtn.innerText = "RESPAWN";
    uiOverlay.classList.remove("hidden");
}

// Fixed directional map handlers binding WASD & ARROWS together smoothly
window.addEventListener("keydown", e => {
    if (!isPlaying && (e.key === " " || e.key === "Enter")) {
        handleMenuClick();
        return;
    }

    switch (e.key.toLowerCase()) {
        case "arrowup":
        case "w":
            if (dy !== 1)  { nextDx = 0; nextDy = -1; } break;
        case "arrowdown":
        case "s":
            if (dy !== -1) { nextDx = 0; nextDy = 1; }  break;
        case "arrowleft":
        case "a":
            if (dx !== 1)  { nextDx = -1; nextDy = 0; } break;
        case "arrowright":
        case "d":
            if (dx !== -1) { nextDx = 1; nextDy = 0; }  break;
    }
});
