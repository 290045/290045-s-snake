<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>290045's Snake Game</title>
    <style>
        body { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            background: #4A752C; /* Google Snake dark green grass border background */
            color: #fff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            user-select: none;
        }
        #game-container {
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            border-radius: 10px;
            overflow: hidden;
        }
        #top-bar {
            width: 560px;
            height: 50px;
            background: #4A752C;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
            font-size: 24px;
            font-weight: bold;
        }
        .ui-element {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        canvas { 
            background: #A2D149; /* Google Snake bright checkered grass color */
            display: block;
        }
        #ui-overlay {
            position: absolute;
            top: 50px; /* Below top bar */
            left: 0;
            width: 560px;
            height: 560px;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
            transition: opacity 0.3s ease;
        }
        #ui-overlay.hidden {
            display: none;
        }
        #ui-overlay h1 {
            font-size: 48px;
            margin: 0 0 10px 0;
            color: #FF5722;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        #ui-overlay p {
            font-size: 20px;
            margin: 0 0 30px 0;
        }
        #play-btn {
            background: #1565C0;
            color: white;
            border: none;
            padding: 12px 35px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: all 0.2s ease;
        }
        #play-btn:hover {
            background: #1E88E5;
            transform: translateY(-2px);
        }
        #play-btn:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Top bar for keeping track of score visually -->
        <div id="top-bar">
            <div class="ui-element">🍎 <span id="score">0</span></div>
            <div class="ui-element">🏆 <span id="highscore">0</span></div>
        </div>

        <canvas id="gameCanvas" width="560" height="560"></canvas>

        <!-- Built-in Overlay Screen instead of alerts -->
        <div id="ui-overlay">
            <h1 id="menu-title">SNAKE</h1>
            <p id="menu-text">Press the button or spacebar to play</p>
            <button id="play-btn" onclick="handleMenuClick()">PLAY</button>
        </div>
    </div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const scoreElement = document.getElementById("score");
const highscoreElement = document.getElementById("highscore");
const uiOverlay = document.getElementById("ui-overlay");
const menuTitle = document.getElementById("menu-title");
const menuText = document.getElementById("menu-text");
const playBtn = document.getElementById("play-btn");

const gridSize = 35; // Perfect sizing for Google-like checkered board
const tileCount = canvas.width / gridSize;

let snake = [];
let food = { x: 0, y: 0 };
let dx = 1;
let dy = 0;
let nextDx = 1;
let nextDy = 0;
let score = 0;
let highscore = 0;
let gameInterval;
let isPlaying = false;

// Initialization
resetGameData();
drawGridBackground(); 
drawElements();

function resetGameData() {
    snake = [
        { x: 5, y: 8 },
        { x: 4, y: 8 },
        { x: 3, y: 8 }
    ];
    dx = 1; dy = 0;
    nextDx = 1; nextDy = 0;
    score = 0;
    scoreElement.innerText = score;
}

function handleMenuClick() {
    uiOverlay.classList.add("hidden");
    resetGameData();
    isPlaying = true;
    gameInterval = setInterval(update, 130); // Dynamic pacing speed
}

function update() {
    // Lock direction changes per tick to prevent instant self-collision
    dx = nextDx;
    dy = nextDy;

    const head = { x: snake[0].x + dx, y: snake[0].y + dy };
    
    // Check Wall Collisions
    if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
        return gameOver();
    }

    // Check Self Collisions
    for (let cell of snake) {
        if (head.x === cell.x && head.y === cell.y) return gameOver();
    }

    // Add new head to movement chain
    snake.unshift(head);

    // Check Food Collision
    if (head.x === food.x && head.y === food.y) {
        score += 1; // Explicitly goes up by exactly one point
        scoreElement.innerText = score;
        if (score > highscore) {
            highscore = score;
            highscoreElement.innerText = highscore;
        }
        generateFood();
    } else {
        snake.pop(); 
    }

    draw();
}

function drawGridBackground() {
    for (let r = 0; r < tileCount; r++) {
        for (let c = 0; c < tileCount; c++) {
            // Generates the famous Google Snake light/dark checkered grid
            ctx.fillStyle = (r + c) % 2 === 0 ? "#AAD751" : "#A2D149";
            ctx.fillRect(c * gridSize, r * gridSize, gridSize, gridSize);
        }
    }
}

function drawElements() {
    // 1. Draw Apple realistically (Circle, shading, leaf stems)
    const centerX = food.x * gridSize + gridSize / 2;
    const centerY = food.y * gridSize + gridSize / 2;
    const radius = gridSize / 2.3;

    // Apple Body Shadow & Depth
    ctx.beginPath();
    ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
    ctx.fillStyle = "#E53935"; 
    ctx.fill();

    // Apple Leaf stem
    ctx.beginPath();
    ctx.ellipse(centerX + 2, centerY - radius + 2, 4, 2, Math.PI / 4, 0, Math.PI * 2);
    ctx.fillStyle = "#388E3C";
    ctx.fill();

    // 2. Draw Realistic Snake (Rounded head, detailed body sections, eyes)
    snake.forEach((cell, index) => {
        const x = cell.x * gridSize;
        const y = cell.y * gridSize;
        
        if (index === 0) {
            // Draw smooth rounded Snake Head
            ctx.fillStyle = "#3F51B5"; // Sleek dynamic blue/teal color option
            ctx.beginPath();
            ctx.arc(x + gridSize/2, y + gridSize/2, gridSize/2, 0, Math.PI * 2);
            ctx.fill();

            // Render Google style Googly Eyes based on travel velocity direction
            ctx.fillStyle = "#FFF";
            let eyeX1, eyeY1, eyeX2, eyeY2;
            if (dx !== 0) { // Horizontal movement eyes layout
                eyeX1 = x + gridSize/2 + (dx * 5); eyeY1 = y + 8;
                eyeX2 = x + gridSize/2 + (dx * 5); eyeY2 = y + gridSize - 8;
            } else { // Vertical movement eyes layout
                eyeX1 = x + 8; eyeY1 = y + gridSize/2 + (dy * 5);
                eyeX2 = x + gridSize - 8; eyeY2 = y + gridSize/2 + (dy * 5);
            }
            ctx.beginPath(); ctx.arc(eyeX1, eyeY1, 4, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(eyeX2, eyeY2, 4, 0, Math.PI * 2); ctx.fill();

            ctx.fillStyle = "#000"; // Pupils
            ctx.beginPath(); ctx.arc(eyeX1, eyeY1, 2, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(eyeX2, eyeY2, 2, 0, Math.PI * 2); ctx.fill();

        } else {
            // Draw Snake Body with scaling dynamic gradient textures 
            ctx.fillStyle = index % 2 === 0 ? "#4D5EC1" : "#5C6BC0"; 
            const padding = 2; // Sleek spacing lines
            ctx.beginPath();
            ctx.roundRect(x + padding, y + padding, gridSize - padding*2, gridSize - padding*2, 6);
            ctx.fill();
        }
    });
}

function draw() {
    drawGridBackground();
    drawElements();
}

function generateFood() {
    let validPosition = false;
    while (!validPosition) {
        food.x = Math.floor(Math.random() * tileCount);
        food.y = Math.floor(Math.random() * tileCount);
        
        // Ensure apple doesn't spawn inside snake body cells
        validPosition = true;
        for (let cell of snake) {
            if (cell.x === food.x && cell.y === food.y) {
                validPosition = false;
                break;
            }
        }
    }
}

function gameOver() {
    clearInterval(gameInterval);
    isPlaying = false;
    
    // Smoothly re-enable Built-In Menu screen UI
    menuTitle.innerText = "GAME OVER";
    menuTitle.style.color = "#E53935";
    menuText.innerText = `Final Score: ${score}`;
    playBtn.innerText = "TRY AGAIN";
    uiOverlay.classList.remove("hidden");
}

// Controls configuration
window.addEventListener("keydown", e => {
    if (!isPlaying && (e.key === " " || e.key === "Enter")) {
        handleMenuClick();
        return;
    }

    switch (e.key) {
        case "ArrowUp":    if (dy !== 1)  { nextDx = 0; nextDy = -1; } break;
        case "ArrowDown":  if (dy !== -1) { nextDx = 0; nextDy = 1; }  break;
        case "ArrowLeft":  if (dx !== 1)  { nextDx = -1; nextDy = 0; } break;
        case "ArrowRight": if (dx !== -1) { nextDx = 1; nextDy = 0; }  break;
    }
});

generateFood();
